<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAKUBUN Lifestyle Wing 音声ガイド</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <header class="app-header">
      <h1 class="header-title">KAKUBUN Lifestyle Wing<br>音声ガイド</h1>
      <button id="menuBtn" class="menu-trigger" aria-label="メニューを開く">
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav id="sideMenu" class="side-menu">
      <div class="menu-header">
        <h2>スポット一覧</h2>
      </div>
      <ul id="spotList" class="spot-list">
      </ul>
    </nav>
    <div id="menuOverlay" class="menu-overlay"></div>

    <main class="main-content">
      <div class="floor-switch">
        <button id="btn-1f" class="active">1F</button>
        <button id="btn-2f">2F</button>
      </div>

      <div class="map-wrapper" id="mapWrapper">
        <img src="img/map_1f.jpg" id="mapImage" alt="フロアマップ">
      </div>

      <div class="below-section">
        <div class="swiper mySwiper">
          <div class="swiper-wrapper" id="imageSlider"></div>
          <div class="swiper-pagination"></div>
        </div>
        
        <div class="description-area">
          <h2 id="spotTitle">スポット名</h2>
          <p id="spotDesc">ここに説明文が入ります。</p>
        </div>
      </div>
    </main>

    <footer class="bottom-nav">
      <button id="prevBtn" class="nav-btn">＜</button>
      
      <div class="audio-player">
        <button id="playBtn" class="play-btn" aria-label="再生/一時停止"></button>
        <div class="seek-wrapper">
          <input type="range" id="seekBar" value="0" step="0.1" min="0">
          <div class="time-display">
            <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
          </div>
        </div>
        <audio id="audioElem" preload="metadata"></audio>
      </div>

      <button id="nextBtn" class="nav-btn">＞</button>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
